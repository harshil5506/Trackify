<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log In - Trackify</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <!-- Log In Page -->
    <div class="page login-page">
        <p class="page-label">Log In</p>
        
        <div class="circle-decoration circle-top-left"></div>
        <div class="circle-decoration circle-top-right"></div>
        <div class="circle-decoration circle-bottom-left"></div>
        <div class="circle-decoration circle-bottom-right"></div>
        
        <div class="auth-card">
            <div class="wallet-icon">
                <img src="assets/Logo.png" alt="Trackify Logo">
            </div>
            
            <h2 class="auth-heading">Log In Your Account</h2>
            
            <form class="auth-form">
                <div class="input-group">
                    <span class="input-icon">✉️</span>
                    <input type="email" placeholder="Email" required>
                </div>
                
                <div class="input-group">
                    <span class="input-icon">🔒</span>
                    <input type="password" placeholder="Password" required>
                </div>
                
                <button type="submit" class="btn-primary">Log In</button>
            </form>
            
            <p class="auth-footer">
                Don't have an account? <a href="signup.html">Sign Up</a>
            </p>
        </div>
        
        <div class="wave-bottom"></div>
    </div>
</body>
</html>
