<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Trackify - Forgot Password</title>
  
  <link rel="stylesheet" href="css/auth.css" />
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&family=Inter:wght@400;500&display=swap" rel="stylesheet"/>
</head>
<body class="auth-page">

  <div class="auth-wrapper">
    <div class="auth-card">

      <!-- Logo + Brand at top of card -->
      <div class="card-logo">
        <img src="assets/logo1.jpeg" alt="Trackify Logo" class="logo-img" />
        <span class="brand-name">Trackify</span>
      </div>

      <p class="verify-secure-label">Secure Account Recovery</p>

      <h2 class="auth-title">Forgot Password?</h2>
      <p class="auth-subtitle">Enter your email address and we'll send you a 6-digit verification code to reset your password.</p>

      <form class="auth-form" id="forgotForm">

        <div class="form-group">
          <label for="email">EMAIL ADDRESS</label>
          <input type="email" id="email" name="email" placeholder="Enter your email" />
          <span class="field-error" id="email-error"></span>
        </div>

        <button type="submit" class="btn-primary">Send Reset Code</button>

      </form>

      <!-- Back to sign in -->
      <div class="verify-resend">
        <a href="signin.html">&#8249; Back to Sign In</a>
      </div>

      <p class="verify-support">Need help? <a href="#">Contact Support</a></p>

    </div>
  </div>

  <script src="js/forgot-password.js"></script>
</body>
</html>
