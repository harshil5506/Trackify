<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - Trackify</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <div class="auth-container">
        <div class="circle-decoration circle-top-left"></div>
        <div class="circle-decoration circle-top-right"></div>
        <div class="circle-decoration circle-bottom-right"></div>
        
        <div class="auth-box">
            <div class="logo-header">
                <img src="assets/logo.png" alt="Trackify Logo" class="auth-logo">
                <h2 class="brand-name">Trackify</h2>
            </div>
            
            <h3 class="auth-title">Create Your Account</h3>
            
            <form class="auth-form" id="signupForm">
                <div class="input-group">
                    <span class="input-icon">👤</span>
                    <input type="text" placeholder="Full Name" required>
                </div>
                
                <div class="input-group">
                    <span class="input-icon">✉️</span>
                    <input type="email" placeholder="Email" required>
                </div>
                
                <div class="input-group">
                    <span class="input-icon">🔒</span>
                    <input type="password" placeholder="Password" required>
                </div>
                
                <div class="input-group">
                    <span class="input-icon">🔒</span>
                    <input type="password" placeholder="Confirm Password" required>
                </div>
                
                <button type="submit" class="btn btn-auth">Sign Up</button>
            </form>
            
            <p class="auth-footer">
                Already have an account ? <a href="login.html">Login</a>
            </p>
        </div>
        
        <div class="wave-decoration-bottom"></div>
    </div>
</body>
</html>
