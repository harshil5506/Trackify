<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Page Not Found</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <!-- 404 Page -->
    <div class="error-page">
        <!-- Top Navigation Bar -->
        <div class="top-bar">
            <div class="logo-section">
                <img src="assets/Logo.png" alt="Trackify Logo" class="logo-small">
            </div>
            <nav class="main-nav">
                <a href="index.html" class="nav-link">Home</a>
                <a href="profile.html" class="nav-link">Profile</a>
                <a href="#" class="nav-link">About</a>
                <a href="#" class="nav-link">Contact</a>
            </nav>
        </div>

        <!-- 404 Content -->
        <div class="error-content">
            <div class="error-icon">
                <svg width="120" height="120" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                    <rect x="3" y="3" width="18" height="18" rx="2" />
                    <line x1="9" y1="9" x2="15" y2="15" />
                    <line x1="15" y1="9" x2="9" y2="15" />
                </svg>
            </div>

            <h1 class="error-code">404</h1>
            <h2 class="error-title">Page Not Found</h2>
            <p class="error-message">
                Sorry, we couldn't find the page you're looking for. The page might<br>
                have been removed or the URL might be incorrect
            </p>

            <p class="error-help">
                Need help? Our team is here to help . <a href="contact.html" class="contact-link">Contact us</a>
            </p>
        </div>
    </div>
</body>
</html>
