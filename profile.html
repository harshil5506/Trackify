<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Profile - Trackify</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <div class="nav-brand">
                <img src="assets/logo.png" alt="Trackify Logo" class="nav-logo">
                <span class="brand-name">Trackify</span>
            </div>
            <ul class="nav-menu">
                <li><a href="dashboard.html">Home</a></li>
                <li><a href="profile.html" class="active">Profile</a></li>
                <li><a href="about.html">About</a></li>
                <li><a href="contact.html">Contact</a></li>
            </ul>
        </div>
    </nav>

    <div class="profile-container">
        <div class="page-header">
            <h1>User Profile</h1>
            <a href="edit-profile.html" class="btn btn-primary">
                ✏️ Edit Profile ›
            </a>
        </div>

        <div class="profile-content">
            <div class="profile-sidebar">
                <div class="profile-card">
                    <div class="profile-avatar-container">
                        <div class="profile-avatar">
                            <span class="avatar-icon">👤</span>
                        </div>
                    </div>
                    <h3>Edit Profile</h3>
                    <button class="btn btn-secondary">Upload Photo</button>
                </div>

                <div class="account-settings-card">
                    <h3>Account Settings</h3>
                    <div class="settings-item">
                        <span class="settings-label">👤 User Id:</span>
                        <span class="settings-value">U12345</span>
                    </div>
                    <div class="settings-item">
                        <span class="settings-label">⚫ Joined On:</span>
                        <span class="settings-value">Jan 15, 2024</span>
                    </div>
                </div>
            </div>

            <div class="profile-main">
                <div class="info-card">
                    <h2>Personal Information</h2>
                    <div class="info-grid">
                        <div class="info-item">
                            <span class="info-icon">👤</span>
                            <span class="info-label">Full Name</span>
                            <span class="info-value"></span>
                        </div>
                        <div class="info-item">
                            <span class="info-icon">✉️</span>
                            <span class="info-label">Email</span>
                            <span class="info-value"></span>
                        </div>
                        <div class="info-item">
                            <span class="info-icon">👤</span>
                            <span class="info-label">Username</span>
                            <span class="info-value"></span>
                        </div>
                        <div class="info-item">
                            <span class="info-icon">📞</span>
                            <span class="info-label">Phone</span>
                            <span class="info-value"></span>
                        </div>
                        <div class="info-item">
                            <span class="info-icon">📍</span>
                            <span class="info-label">Address</span>
                            <span class="info-value"></span>
                        </div>
                        <div class="info-item">
                            <span class="info-icon">📅</span>
                            <span class="info-label">DOB</span>
                            <span class="info-value"></span>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
