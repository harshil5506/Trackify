<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Profile - Trackify</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <div class="nav-brand">
                <img src="assets/logo.png" alt="Trackify Logo" class="nav-logo">
                <span class="brand-name">Trackify</span>
            </div>
            <ul class="nav-menu">
                <li><a href="dashboard.html">Home</a></li>
                <li><a href="profile.html" class="active">Profile</a></li>
                <li><a href="about.html">About</a></li>
                <li><a href="contact.html">Contact</a></li>
            </ul>
        </div>
    </nav>

    <div class="profile-container">
        <div class="page-header">
            <h1>Edit Profile</h1>
            <a href="profile.html" class="btn btn-secondary">Cancel</a>
        </div>

        <div class="edit-profile-content">
            <form class="edit-form" id="editProfileForm">
                <div class="form-section">
                    <h2>Personal Information</h2>
                    
                    <div class="form-row">
                        <div class="form-group">
                            <label>Full Name</label>
                            <input type="text" placeholder="Enter Full Name" >
                        </div>
                        <div class="form-group">
                            <label>Username</label>
                            <input type="text" placeholder="Enter Username">
                        </div>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label>Email</label>
                            <input type="email" placeholder="Enter Email">
                        </div>
                        <div class="form-group">
                            <label>Phone</label>
                            <input type="tel" placeholder="Enter Phone No">
                        </div>
                    </div>

                    <div class="form-group">
                        <label>Address</label>
                        <input type="text" placeholder="Enter Address">
                    </div>

                    <div class="form-group">
                        <label>Date of Birth</label>
                        <input type="date" placeholder="Enter Birth Date">
                    </div>
                </div>

                <div class="form-section">
                    <h2>Change Password</h2>
                    
                    <div class="form-group">
                        <label>Current Password</label>
                        <input type="password" placeholder="Enter current password">
                    </div>

                    <div class="form-group">
                        <label>New Password</label>
                        <input type="password" placeholder="Enter new password">
                    </div>

                    <div class="form-group">
                        <label>Confirm New Password</label>
                        <input type="password" placeholder="Confirm new password">
                    </div>
                </div>

                <div class="form-actions">
                    <button type="submit" class="btn btn-primary">Save Changes</button>
                    <a href="profile.html" class="btn btn-secondary">Cancel</a>
                </div>
            </form>
        </div>
    </div>
</body>
</html>
